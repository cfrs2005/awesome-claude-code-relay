name: Providers Check

# 收录 PR 的确定性校验 + 合并执行器。自动合并的唯一依据；Claude/GLM 的分诊结论仅供参考。
#
# 触发:
#   pull_request (providers/**)      → 常规校验（Hub 验证未通过时在门禁处失败）
#   issue_comment 包含 /mq-done      → Hub 验证完成后由提交者触发，全绿即直接 squash 合并
#
# 前置要求（一次性）:
#   - Settings → General → Allow squash merge（API 可配）
#   - 分支保护 required check: providers-check（API 可配）
#   - Secrets: MQ_HUB_URL / MQ_HUB_TOKEN（Hub 注册与门禁）、MQ_BOT_TOKEN（fork PR 评论与合并）

on:
  pull_request:
    paths:
      - "providers/**"
      - ".github/workflows/providers-check.yml"
  issue_comment:
    types: [created]

permissions: {}

# 同一 PR 串行化：评论命令风暴时排队而非并发堆叠
concurrency:
  group: providers-check-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    name: providers-check
    # ⚠️ 自触发防护（2026-11-04 事故后加固，勿改回 contains）：
    #    本工作流自己发的评论，正文里带有 "/mq-done" 字样（如失败提示"完成验证后评论 /mq-done"），
    #    而评论又用 MQ_BOT_TOKEN（用户 PAT）发布 —— PAT 发出的评论会再次触发 issue_comment。
    #    旧条件用 contains() ⇒ 失败评论 → 再触发 → 再失败评论 …… 24 分钟 777 次运行、60+ 重复评论，
    #    直到 GitHub 触发二级限流（GraphQL: was submitted too quickly）才被动停下。
    #
    #    现在三重门：① 必须是"以 /mq-done 开头"的指令评论（本工作流/Hub 报告均以中文或 ## 开头）
    #              ② 排除 Bot 身份 ③ 必须是 PR 的评论（非普通 issue）
    #    新增任何会"发评论"的步骤时：评论正文不得以 /mq-done 开头。
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment'
       && github.event.issue.pull_request != null
       && github.event.comment.user.type != 'Bot'
       && startsWith(github.event.comment.body, '/mq-done'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      REPO: ${{ github.repository }}
      PR_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Fetch PR head
        run: git fetch origin "pull/$PR_NUMBER/head:pr-head"

      - name: Validate provider changes
        id: validate
        run: |
          python3 scripts/check_providers.py --base origin/main --head pr-head

      # 提交者必须已 Watch 本项目（repos/{repo}/subscribers 公开端点）
      - name: Require author watches this repo
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "检查 @$PR_AUTHOR 是否已 Watch 本仓库..."
          watchers=$(gh api --paginate -X GET "repos/$REPO/subscribers" --jq '.[].login' || true)
          if printf '%s\n' "$watchers" | grep -qixF "$PR_AUTHOR"; then
            echo "watched=true" >> "$GITHUB_OUTPUT"
            echo "✅ @$PR_AUTHOR 已 Watch 本项目"
          else
            echo "watched=false" >> "$GITHUB_OUTPUT"
            echo "❌ @$PR_AUTHOR 尚未 Watch 本项目（$REPO 的 subscribers 列表中未找到）"
          fi

      # MQ Hub 验证门禁：新收录条目必须完成 Hub 验证（mq-manual 标签绕过 + 禁用自动合并）
      - name: MQ Hub verification gate
        id: hub
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_URL: ${{ secrets.MQ_HUB_URL }}
          HUB_TOKEN: ${{ secrets.MQ_HUB_TOKEN }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name' || true)
          if printf '%s\n' "$labels" | grep -qx 'mq-manual'; then
            echo "hub-gate=skipped" >> "$GITHUB_OUTPUT"
            echo "mq-manual 标签：跳过 Hub 门禁，本 PR 转人工合并（本工作流不执行合并）"
            exit 0
          fi
          if [ -z "$HUB_URL" ] || [ -z "$HUB_TOKEN" ]; then
            echo "hub-gate=unconfigured" >> "$GITHUB_OUTPUT"
            echo "::warning::MQ_HUB_URL / MQ_HUB_TOKEN 未配置，Hub 门禁未生效"
            exit 0
          fi
          echo "hub-gate=checked" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -m 20 -o /tmp/hub.json -w '%{http_code}' \
            -H "X-Hub-Token: $HUB_TOKEN" "$HUB_URL/api/prs/$PR_NUMBER") || code=000
          if [ "$code" != "200" ]; then
            echo "::error::Hub 不可达（HTTP $code）。验证服务暂不可用时不自动合并；维护者可打 mq-manual 标签转人工"
            exit 1
          fi
          python3 scripts/hub_gate.py /tmp/hub.json

      - name: Repost verification report (on /mq-done)
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
          HUB_URL: ${{ secrets.MQ_HUB_URL }}
          HUB_TOKEN: ${{ secrets.MQ_HUB_TOKEN }}
        run: |
          set -euo pipefail
          url=$(python3 -c "import json;d=json.load(open('/tmp/hub.json'));print((d.get('result') or {}).get('report_url') or '')")
          if [ -n "$url" ]; then
            curl -fsS -m 20 "$url" -o /tmp/report.md && \
            { echo "## 📋 MQ 验证报告（合并前存档）"; echo; cat /tmp/report.md; } > /tmp/report_full.md && \
            python3 -c "import pathlib;p=pathlib.Path('/tmp/report_full.md');p.write_text(p.read_text(encoding='utf-8').replace('/mq-done','/mq\u200b-done'),encoding='utf-8')" && \
            gh pr comment "$PR_NUMBER" --body-file /tmp/report_full.md || echo "报告回贴跳过"
          fi

      # 结果评论用"就地更新"而非每次新发：即使逻辑再出问题，PR 上也只有一条评论
      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
          VALIDATED: ${{ steps.validate.outcome }}
          WATCHED: ${{ steps.watch.outputs.watched }}
          HUB_GATE: ${{ steps.hub.outcome }}
          HUB_MODE: ${{ steps.hub.outputs.hub-gate }}
        run: |
          set -euo pipefail
          if [ "$VALIDATED" = "success" ] && [ "$WATCHED" = "true" ] && { [ "$HUB_MODE" = "skipped" ] || [ "$HUB_GATE" = "success" ]; }; then
            body="✅ **Providers Check 全部通过**
          - 条目校验 / Watch 检查 / Hub 门禁均通过$( [ "$HUB_MODE" = "skipped" ] && echo '（mq-manual：转人工合并）' || echo '' )
          - $( [ "$HUB_MODE" = "skipped" ] && echo '请维护者手动合并' || echo '正在合并…' )"
          else
            reason=""
            [ "$VALIDATED" != "success" ] && reason="${reason}条目校验未通过；"
            [ "$WATCHED" != "true" ] && reason="${reason}提交者未 Watch 项目；"
            [ "$HUB_GATE" != "success" ] && [ "$HUB_MODE" != "skipped" ] && reason="${reason}Hub 验证未通过（完成验证后评论 /mq-done）；"
            body="❌ **Providers Check 未通过**：${reason:-未知}
          详情见 Checks → providers-check 的 Summary。"
          fi
          # 标记 + 正文写文件；正文中出现的 /mq-done 字样不会被触发（触发条件要求以它开头）
          printf '%s\n\n<!-- providers-check-result -->\n' "$body" > /tmp/result.md
          cid=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
                  --jq '[.[] | select(.body | contains("<!-- providers-check-result -->")) | .id] | last // empty' || true)
          if [ -n "${cid:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$(cat /tmp/result.md)" >/dev/null \
              && echo "已就地更新结果评论 #$cid" || echo "::warning::结果评论更新失败"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/result.md || \
              echo "::warning::评论失败（fork PR 未配置 MQ_BOT_TOKEN 时属预期）"
          fi

      # 直接 squash 合并（分支保护仍生效：required check 由本次运行满足）
      # 用 MQ_BOT_TOKEN（PAT）而非 GITHUB_TOKEN：GITHUB_TOKEN 的合并不会触发 sync-readme 等后续 workflow
      - name: Merge PR (squash)
        if: >
          steps.validate.outcome == 'success' &&
          steps.watch.outputs.watched == 'true' &&
          steps.hub.outcome == 'success' &&
          steps.hub.outputs.hub-gate != 'skipped'
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash \
            || echo "::warning::合并失败（可能存在分支保护的其他要求），请维护者手动合并"
