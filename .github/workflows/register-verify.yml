name: Register Verify

# PR 触碰 providers/** 时：
#  1. 从 PR diff 提取待测条目（api_base/model/provider_id）注册到 MQ Hub
#  2. PR 打开时发布验证指引评论（入口、临时 Key 规则）
# 所需 Secrets: MQ_HUB_URL（如 https://mq.80aj.com）, MQ_HUB_TOKEN

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "providers/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register PR to MQ Hub
        id: register
        env:
          MQ_HUB_TOKEN: ${{ secrets.MQ_HUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.MQ_HUB_URL }}" ]; then
            echo "MQ_HUB_URL 未配置，跳过（不影响 PR 其他检查）"
            exit 0
          fi
          python3 scripts/register_hub.py \
            --hub-url "${{ secrets.MQ_HUB_URL }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --author "$PR_AUTHOR" \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out /tmp/hub_comment.md

      - name: Comment guide (PR opened)
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/hub_comment.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/hub_comment.md || \
              echo "::warning::评论失败（fork PR 未配置 MQ_BOT_TOKEN 时属预期）"
          fi
