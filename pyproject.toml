[tool.ruff]
# 只先守住「会直接报错」的一类：语法/未定义名/未使用导入。
# 风格类规则暂不引入，避免一次大改淹没真正的缺陷。
line-length = 100
target-version = "py39"
exclude = [".venv", "design", "reports", "docs-private"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:scripts.*"]
