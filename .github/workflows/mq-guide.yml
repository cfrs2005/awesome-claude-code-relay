name: MQ Guide

# PR 触碰 providers/** 时，发一条指引评论：告诉提交者在自己机器上跑 MQ、
# 把报告贴回 PR。本工作流不接收 Key、不注册任何服务、不跑测试。
#
# 报告核验在 providers-check 里完成（见 check_mq_report.py）。

on:
  pull_request:
    types: [opened]
    paths:
      - "providers/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  guide:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build guide comment
        run: |
          set -euo pipefail
          python3 scripts/pr_guide.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --out /tmp/mq_guide.md

      - name: Comment guide
        env:
          GH_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/mq_guide.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/mq_guide.md || \
              echo "::warning::评论失败（fork PR 未配置 MQ_BOT_TOKEN 时属预期）"
          fi
