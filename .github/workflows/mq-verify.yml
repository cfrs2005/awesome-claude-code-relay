name: MQ Verify

# 官方验证执行器：接收一次性 Key（来自 MQ 收 key 入口，见 docs/verification-design.md），
# 运行 mq/mq.py 引擎，把报告回贴 PR 并更新 provider 状态。
#
# 安全约定:
#   - Key 只存在于 /tmp/mq.key（0600），绝不 echo、绝不写入日志/artifact/GitHub
#   - 报告由引擎脱敏后输出；引擎只访问目标 base_url
#   - 本 workflow 只运行 main 分支的代码（不 checkout PR head，杜绝 pwn request）
#
# 触发:
#   repository_dispatch: mq-verify   ← Key 入口服务在收到临时 Key 后触发
#     client_payload: { pr_number, provider_id, fetch_url, fetch_token }
#   workflow_dispatch: 维护者手动跑（需提供 fetch_url/fetch_token，或用 base_url+key-file 之外的途径）

on:
  repository_dispatch:
    types: [mq-verify]
  workflow_dispatch:
    inputs:
      provider_id:
        description: "providers/ 下的条目 id"
        required: true
      pr_number:
        description: "关联 PR 号（可空）"
        required: false
        default: ""
      fetch_url:
        description: "一次性 Key 读取地址（来自 MQ 入口）"
        required: false
        default: ""
      fetch_token:
        description: "一次性读取凭证"
        required: false
        default: ""

permissions: {}

jobs:
  verify:
    if: github.event_name == 'repository_dispatch' || inputs.provider_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # 回写 verification 状态
      pull-requests: write  # 回贴报告
    env:
      PROVIDER_ID: ${{ github.event.client_payload.provider_id || inputs.provider_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
      FETCH_URL: ${{ github.event.client_payload.fetch_url || inputs.fetch_url }}
      FETCH_TOKEN: ${{ github.event.client_payload.fetch_token || inputs.fetch_token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4   # 只 checkout main（绝不运行 PR head 代码）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve provider endpoint
        id: provider
        run: |
          set -euo pipefail
          f="providers/$PROVIDER_ID.json"
          [ -f "$f" ] || { echo "条目不存在: $f"; exit 1; }
          base=$(python3 -c "import json;print(json.load(open('$f')).get('api_base') or '')")
          if [ -z "$base" ]; then
            echo "::error::该条目 api_base 为空，无法验证（需要服务商提供端点）"
            exit 1
          fi
          model=$(python3 -c "import json;m=json.load(open('$f')).get('models_claimed') or [];print(m[0] if m else 'claude-haiku-4-5-20251001')")
          {
            echo "base=$base"
            echo "model=$model"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch one-time key (never logged)
        if: env.FETCH_URL != ''
        run: |
          set -euo pipefail
          umask 077
          code=$(curl -fsS -o /tmp/key.json -w '%{http_code}' -X POST "$FETCH_URL" \
            -H "authorization: Bearer $FETCH_TOKEN" --max-time 20) || code=000
          if [ "$code" != "200" ]; then
            echo "::error::一次性 Key 获取失败（HTTP $code）。Key 可能已过期或已被消费"
            exit 1
          fi
          jq -r '.key' /tmp/key.json > /tmp/mq.key
          grep -q . /tmp/mq.key || { echo "::error::Key 内容为空"; exit 1; }
          rm -f /tmp/key.json

      - name: Run MQ engine
        id: engine
        env:
          MQ_BASE: ${{ steps.provider.outputs.base }}
          MQ_MODEL: ${{ steps.provider.outputs.model }}
        run: |
          set -euo pipefail
          python3 mq/mq.py \
            --base-url "$MQ_BASE" \
            --key-file /tmp/mq.key \
            --model "$MQ_MODEL" \
            --rounds 4 \
            --json /tmp/report.json \
            --markdown /tmp/report.md
          python3 -c "import json;d=json.load(open('/tmp/report.json'));print('VERDICT='+d['verdict']['label'])" >> "$GITHUB_OUTPUT"

      - name: Cleanup key
        if: always()
        run: |
          rm -f /tmp/mq.key /tmp/key.json
          echo "临时 Key 已删除（Key 入口侧为一次性读取，也已失效）"

      - name: Update provider verification status
        id: update
        run: |
          set -euo pipefail
          map=$(python3 -c "import json;d=json.load(open('/tmp/report.json'));print(d['verdict']['label'])")
          python3 scripts/update_verification.py "providers/$PROVIDER_ID.json" \
            --status "$map" --engine "$(python3 -c "import json;print(json.load(open('/tmp/report.json'))['engine'])")"
          git config user.name "mq-bot"
          git config user.email "mq-bot@users.noreply.github.com"
          git add "providers/$PROVIDER_ID.json"
          git commit -m "mq: update $PROVIDER_ID -> $map [skip ci]" || echo "无变更"
          git push

      - name: Post report to PR
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body-file /tmp/report.md || \
            echo "::warning::报告回贴失败，报告已体现在本 Summary"
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY" || true
