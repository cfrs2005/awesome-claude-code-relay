name: Sync README

# providers/** 合并进 main 后：
#  1. 从 PR 正文/评论里的 MQ 机器可读块取结论，回写 verification 状态
#  2. 从 providers/*.json 重新生成 README 目录表
# 使用 MQ_BOT_TOKEN 推送（GITHUB_TOKEN 的推送会绕过/不触发后续 workflow，且可能被分支保护拦截）
#
# 支持手动触发：回写步骤被意外打断、或只改了 workflow 的合并没触发本工作流时，
# 用 workflow_dispatch 指定 PR 号补跑一次。
#
# 设计约束（2026-11 修订）：回写失败必须让 job 变红。
# 此前 PR 号没有真正传进子进程，`gh pr view ""` 静默失败 → 状态丢、job 仍绿，
# 目录长期停在「未验证」。现在由 scripts/writeback.py 用退出码表达三态：
#   0 = 已回写　2 = 确认无需回写　3 = 应当回写但做不到（判红）

on:
  push:
    branches: [main]
    paths:
      - "providers/**"
  workflow_dispatch:
    inputs:
      pr:
        description: "要回写的 PR 号（合并提交里没有 #N 时必填）"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MQ_BOT_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve PR number
        id: pr
        env:
          INPUT_PR: ${{ inputs.pr }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          number="$(printf '%s' "${INPUT_PR:-}" | tr -dc '0-9')"
          if [ -z "$number" ]; then
            number="$(printf '%s' "${COMMIT_MSG:-}" \
              | grep -oE '#[0-9]+' | head -1 | tr -dc '0-9' || true)"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
          echo "解出 PR 号：${number:-（无）}"

      - name: Apply verification result from PR report (post-merge fixup)
        id: writeback
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --inputs-pr "${PR_NUMBER:-}" --commit-msg "${COMMIT_MSG:-}")
          if [ "$IS_DISPATCH" = "true" ]; then
            args+=(--strict)
          fi
          python3 scripts/writeback.py "${args[@]}"

      - name: Fail visibly when writeback could not run
        if: steps.writeback.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::error::验证回写失败：见上方日志与 Job Summary。目录状态未更新，不要当作已完成。"
          if [ -n "${PR_NUMBER:-}" ]; then
            body="$(printf '%s\n\n%s\n' \
              "⚠️ 合并后的状态回写没有成功，目录里该条目仍显示为未验证。" \
              "这不是提交者的问题，是维护侧的流水线故障。维护者可从 Actions 的 Sync README 运行记录看到原因；修复后用 workflow_dispatch 指定 PR #${PR_NUMBER} 补跑。")"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body" || true
          fi
          exit 1

      - name: Rebuild providers table
        run: python3 scripts/build_readme.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "mq-bot"
          git config user.email "mq-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "无变更"
            exit 0
          fi
          git add -A
          git commit -m "chore: sync README + verification status [skip ci]"
          # 连续合并两个 PR 时远端可能已前进，先 rebase 再推，避免直接冲突退出。
          git pull --rebase --autostash origin main
          git push
