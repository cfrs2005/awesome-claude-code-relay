name: Providers Check

# 收录 PR 的确定性校验 + 合并执行器。自动合并的唯一依据；Claude/GLM 的分诊结论仅供参考。
#
# 触发:
#   pull_request (providers/**)      → 常规校验（PR 里没有合格 MQ 报告时在门禁处不合并）
#   issue_comment 包含 /mq-done      → 提交者补了报告或想重新检查时触发
#
# MQ 报告门禁（NQ 式）:
#   提交者在**自己机器上**跑 MQ 引擎，把报告全文贴到 PR。本工作流只核验三件确定性的事：
#   ①报告存在且可解析 ②报告 host == 条目 api_base host ③报告未过期且结论合格。
#   三项全过即自动合并。不需要绑定码、不需要提交 Key 给任何服务端。
#
# 前置要求（一次性）:
#   - Settings → General → Allow squash merge（API 可配）
#   - 分支保护 required check: providers-check（API 可配）
#   - Secrets: MQ_BOT_TOKEN（fork PR 评论与合并，建议用专用 bot 账号）

on:
  pull_request:
    paths:
      - "providers/**"
      - ".github/workflows/providers-check.yml"
  issue_comment:
    types: [created]

permissions: {}

# 同一 PR 串行化：评论命令风暴时排队而非并发堆叠
concurrency:
  group: providers-check-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    name: providers-check
    # ⚠️ 自触发防护（2026-11-04 事故后加固，勿改回 contains）：
    #    本工作流自己发的评论，正文里带有 "/mq-done" 字样（如失败提示"完成验证后评论 /mq-done"），
    #    而评论又用 MQ_BOT_TOKEN（用户 PAT）发布 —— PAT 发出的评论会再次触发 issue_comment。
    #    旧条件用 contains() ⇒ 失败评论 → 再触发 → 再失败评论 …… 24 分钟 777 次运行、60+ 重复评论，
    #    直到 GitHub 触发二级限流（GraphQL: was submitted too quickly）才被动停下。
    #
    #    现在三重门：① 必须是"以 /mq-done 开头"的指令评论（本工作流/Hub 报告均以中文或 ## 开头）
    #              ② 排除 Bot 身份 ③ 必须是 PR 的评论（非普通 issue）
    #    新增任何会"发评论"的步骤时：评论正文不得以 /mq-done 开头。
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment'
       && github.event.issue.pull_request != null
       && github.event.comment.user.type != 'Bot'
       && startsWith(github.event.comment.body, '/mq-done'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      REPO: ${{ github.repository }}
      PR_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Fetch PR head
        run: git fetch origin "pull/$PR_NUMBER/head:pr-head"

      - name: Validate provider changes
        id: validate
        run: |
          python3 scripts/check_providers.py --base origin/main --head pr-head

      # 提交者必须已 Watch 本项目（repos/{repo}/subscribers 公开端点）
      - name: Require author watches this repo
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "检查 @$PR_AUTHOR 是否已 Watch 本仓库..."
          # 仓库 owner 与 admin 不必 Watch 自己的仓库
          owner=$(gh api "repos/$REPO" --jq '.owner.login' 2>/dev/null || echo "")
          perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          if [ -n "$owner" ] && [ "$PR_AUTHOR" = "$owner" ]; then
            echo "watched=true" >> "$GITHUB_OUTPUT"
            echo "✅ @$PR_AUTHOR 是仓库 owner，跳过 Watch 检查"
            exit 0
          fi
          if [ "$perm" = "admin" ]; then
            echo "watched=true" >> "$GITHUB_OUTPUT"
            echo "✅ @$PR_AUTHOR 有 admin 权限，跳过 Watch 检查"
            exit 0
          fi
          watchers=$(gh api --paginate -X GET "repos/$REPO/subscribers" --jq '.[].login' || true)
          if printf '%s\n' "$watchers" | grep -qixF "$PR_AUTHOR"; then
            echo "watched=true" >> "$GITHUB_OUTPUT"
            echo "✅ @$PR_AUTHOR 已 Watch 本项目"
          else
            echo "watched=false" >> "$GITHUB_OUTPUT"
            echo "❌ @$PR_AUTHOR 尚未 Watch 本项目（$REPO 的 subscribers 列表中未找到）"
          fi

      # MQ 实测报告门禁（NQ 式）：
      #   提交者在自己机器上跑 MQ，把报告贴进 PR。这里只做三件确定性的事——
      #   报告存在、报告 host == 条目 api_base host（防测 A 卖 B）、报告未过期且结论合格。
      #   三项全过即放行自动合并；任何一项不过都不合并，并给出重测指引。
      #   mq-manual 标签绕过，转人工合并。
      - name: MQ report gate
        id: mq
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name' || true)
          if printf '%s\n' "$labels" | grep -qx 'mq-manual'; then
            echo "mq-state=manual" >> "$GITHUB_OUTPUT"
            echo "mq-manual 标签：跳过 MQ 报告门禁，本 PR 转人工合并"
            exit 0
          fi

          # 把 PR 正文和所有评论拼成一份文本，供脚本查找机器可读块
          {
            gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' || true
            echo
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].body' || true
          } > /tmp/pr_text.txt
          echo "PR 文本长度: $(wc -c < /tmp/pr_text.txt) 字节"

          set +e
          python3 scripts/check_mq_report.py \
            --text /tmp/pr_text.txt \
            --base origin/main \
            --head pr-head \
            --summary-file /tmp/mq_summary.md \
            --json-out /tmp/mq_result.json
          rc=$?
          set -e
          state=$(python3 -c "import json;print(json.load(open('/tmp/mq_result.json'))['state'])")
          echo "mq-state=$state" >> "$GITHUB_OUTPUT"
          echo "报告核验状态: $state"
          if [ "$rc" != "0" ]; then
            echo "::warning::MQ 报告核验未通过（state=$state），本 PR 不会自动合并"
          fi
          exit 0

      - name: Publish MQ report summary
        if: always()
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f /tmp/mq_summary.md ]; then
            cat /tmp/mq_summary.md >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # 结果评论用"就地更新"而非每次新发：即使逻辑再出问题，PR 上也只有一条评论
      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
          VALIDATED: ${{ steps.validate.outcome }}
          WATCHED: ${{ steps.watch.outputs.watched }}
          MQ_STATE: ${{ steps.mq.outputs.mq-state }}
        run: |
          set -euo pipefail
          if [ "$VALIDATED" = "success" ] && [ "$WATCHED" = "true" ] \
             && { [ "$MQ_STATE" = "ok" ] || [ "$MQ_STATE" = "manual" ] \
                  || [ "$MQ_STATE" = "not_applicable" ]; }; then
            if [ "$MQ_STATE" = "manual" ]; then
              body="✅ **可以合并**（mq-manual：转人工）
          - 条目校验、Watch 检查通过；MQ 报告门禁已由维护者跳过
          - 请维护者手动合并"
            else
              body="✅ **全部通过，正在自动合并**
          - 条目校验、Watch 检查、MQ 报告核验均通过"
            fi
          else
            reason=""
            [ "$VALIDATED" != "success" ] && reason="${reason}条目校验未通过；"
            [ "$WATCHED" != "true" ] && reason="${reason}提交者未 Watch 项目；"
            case "$MQ_STATE" in
              missing)         reason="${reason}PR 里还没有 MQ 测试报告；" ;;
              no_declared_base) reason="${reason}条目缺少 api_base；" ;;
              host_mismatch)   reason="${reason}报告测的端点与条目声明的 api_base 不一致；" ;;
              stale)           reason="${reason}MQ 报告已过期，请重跑；" ;;
              retest)          reason="${reason}上次测试没有做成，请重跑；" ;;
              failed)          reason="${reason}MQ 报告结论不通过；" ;;
              bad_timestamp)   reason="${reason}报告时间戳异常；" ;;
              ok|not_applicable) ;;   # 门禁已过或本 PR 不涉及收录，不该出现在失败文案里
              ""|manual)       ;;
              *)               reason="${reason}MQ 报告核验异常（$MQ_STATE）；" ;;
            esac
            body="⏳ **暂不合并**：${reason:-未知原因}

          下面是对报告的具体核验结果。按提示补一份 MQ 测试报告后，评论 \`/mq-done\` 重新检查。"
          fi
          {
            printf '%s\n\n' "$body"
            if [ -f /tmp/mq_summary.md ]; then cat /tmp/mq_summary.md; fi
            printf '\n<!-- providers-check-result -->\n'
          } > /tmp/result.md
          cid=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
                  --jq '[.[] | select(.body | contains("<!-- providers-check-result -->")) | .id] | last // empty' || true)
          if [ -n "${cid:-}" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$(cat /tmp/result.md)" >/dev/null \
              && echo "已就地更新结果评论 #$cid" || echo "::warning::结果评论更新失败"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/result.md || \
              echo "::warning::评论失败（fork PR 未配置 MQ_BOT_TOKEN 时属预期）"
          fi

      # 直接 squash 合并（分支保护仍生效：required check 由本次运行满足）
      # 用 MQ_BOT_TOKEN（PAT）而非 GITHUB_TOKEN：GITHUB_TOKEN 的合并不会触发 sync-readme 等后续 workflow
      - name: Merge PR (squash)
        if: >
          steps.validate.outcome == 'success' &&
          steps.watch.outputs.watched == 'true' &&
          steps.mq.outputs.mq-state == 'ok'
        env:
          GH_TOKEN: ${{ env.PR_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash \
            || echo "::warning::合并失败（可能存在分支保护的其他要求），请维护者手动合并"
