name: Sync README

# providers/** 合并进 main 后：
#  1. 从合并提交信息解析 PR 号 (#N)，向 Hub 查询验证结果，回写 verification 状态
#  2. 从 providers/*.json 重新生成 README 目录表
# 使用 MQ_BOT_TOKEN 推送（GITHUB_TOKEN 的推送会绕过/不触发后续 workflow，且可能被分支保护拦截）

on:
  push:
    branches: [main]
    paths:
      - "providers/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MQ_BOT_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply verification result from PR report (post-merge fixup)
        env:
          GH_TOKEN: ${{ secrets.MQ_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          msg="${{ github.event.head_commit.message }}"
          pr=$(printf '%s' "$msg" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -z "$pr" ]; then
            echo "提交信息里没有 PR 号，跳过验证回写"
            exit 0
          fi
          export PR_URL="https://github.com/$REPO/pull/$pr"

          # 合并后从 PR 正文 + 评论里取最新一份 MQ 报告的机器可读块
          {
            gh api "repos/$REPO/pulls/$pr" --jq '.body // ""' || true
            echo
            gh api --paginate "repos/$REPO/issues/$pr/comments" --jq '.[].body' || true
          } > /tmp/pr_text.txt

          python3 - <<'EOF'
          import base64, json, os, pathlib, re, subprocess, sys

          pr_url = os.environ.get("PR_URL", "")
          text = pathlib.Path("/tmp/pr_text.txt").read_text(encoding="utf-8", errors="replace")
          reports = []
          for b in re.findall(r"<!--MQ-REPORT:([A-Za-z0-9+/=]+)-->", text):
              try:
                  d = json.loads(base64.b64decode(b, validate=True).decode("utf-8"))
              except Exception:
                  continue
              if isinstance(d, dict) and d.get("verdict") and d.get("host"):
                  reports.append(d)
          if not reports:
              print("PR 里没有可解析的 MQ 报告，跳过验证回写")
              sys.exit(0)

          r = max(reports, key=lambda d: d.get("tested_at") or "")
          files = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD", "--", "providers/"],
                                 capture_output=True, text=True).stdout.split()
          target = next((f for f in files if f.endswith(".json") and f != "providers/schema.json"), None)
          if not target:
              print("未能在本次提交中定位 providers/*.json，跳过")
              sys.exit(0)

          verdict = r["verdict"]
          if verdict == "evidence_insufficient":
              verdict = "inconclusive"
          subprocess.run(["python3", "scripts/update_verification.py", target,
                          "--status", verdict,
                          "--engine", r.get("engine") or "",
                          "--report-url", pr_url], check=True)
          print(f"回写 {target}: {verdict}（报告 {r.get('report_id')} / {r.get('tested_at')}）")
          EOF
          EOF

      - name: Rebuild providers table
        run: python3 scripts/build_readme.py

      - name: Commit if changed
        run: |
          git config user.name "mq-bot"
          git config user.email "mq-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "无变更"
          else
            git add -A
            git commit -m "chore: sync README + verification status [skip ci]"
            git push
          fi
